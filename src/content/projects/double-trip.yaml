# Double Trip: MaxyLAND's first commercial game.
# Image paths are relative to this file.
title: Double Trip
kind: game
status: released
order: 1
released: 2025-05-08
platforms: [Windows, macOS, Linux]
engine: Unity 2023

tagline:
  en: A cozy sokoban for one or two players.
  es: Un sokoban acogedor para uno o dos jugadores.

summary:
  en: Two jelly blobs cross an island archipelago, pushing rocks into holes and rolling logs into bridges. Play it solo or share it in local co-op.
  es: Dos blobs de gelatina cruzan un archipiélago empujando rocas a los agujeros y rodando troncos para hacer puentes. Juégalo en solitario o compártelo en cooperativo local.

body:
  - en: Double Trip is a tile-based sokoban built around two friendly characters. They help each other across the islands, so most puzzles ask you to think with both of them at once.
    es: Double Trip es un sokoban por casillas protagonizado por dos personajes amigables. Se ayudan entre sí para cruzar las islas, así que casi todos los puzles te piden pensar con los dos a la vez.
  - en: Around 30 puzzles spread over an explorable overworld, two to three hours from the first island to the last. The characters are customizable and the game plays with keyboard or gamepad.
    es: Unos 30 puzles repartidos por un mapa explorable, entre dos y tres horas de la primera isla a la última. Los personajes se pueden personalizar y se juega con teclado o mando.
  - en: I made the game in Unity 2023, code and art included. Music, sound and level design are by Javier Reina Ruiz. It launched on Steam and itch.io in May 2025 and has sold more than 500 copies.
    es: Hice el juego en Unity 2023, código y arte incluidos. La música, el sonido y el diseño de niveles son de Javier Reina Ruiz. Salió en Steam e itch.io en mayo de 2025 y ha vendido más de 500 copias.

